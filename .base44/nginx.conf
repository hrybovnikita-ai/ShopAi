# Local Supabase API gateway for the Base44 sandbox.
# Exposes the REST / auth / edge-function surface that supabase-js expects
# (/rest/v1, /auth/v1, /functions/v1) on a single origin.
server {
    listen 8000;
    server_name _;

    client_max_body_size 10m;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location /auth/v1/ {
        proxy_pass http://auth:9999/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header apikey $http_apikey;
        proxy_set_header Authorization $http_authorization;
    }

    location /rest/v1/ {
        proxy_pass http://rest:3000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header apikey $http_apikey;
        proxy_set_header Authorization $http_authorization;
    }

    location /functions/v1/ {
        proxy_pass http://functions:8000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header apikey $http_apikey;
        proxy_set_header Authorization $http_authorization;
    }
}
